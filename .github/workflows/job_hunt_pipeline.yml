name: Twice-Weekly Job Hunt Pipeline

on:
  schedule:
    # Monday & Thursday at 09:00 AM IST (03:30 UTC)
    - cron: '30 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests requests-mock pypdf

      - name: Run test suite
        run: pytest -v

      - name: Execute Job Hunt Pipeline (Dry-Run)
        run: python3 scripts/run_pipeline.py --dry-run

      - name: Commit and push updated tracker and GitHub Pages portal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/openings.json data/Openings_Tracker.md docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: twice-weekly ATS discovery, link audit & portal rebuild"
            git push
          else
            echo "No changes to commit."
          fi
